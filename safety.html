<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Issaquah Sportsmen's Club</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="icon" type="image/x-icon" href="/isc/assets/ISC Logo.png" />
    </head>
    <body class="bg-gray-100 text-gray-800">
        <!-- Header -->
        <div id="header"></div>

        <!-- Info Cards -->
        <section class="py-12 max-w-5xl mx-auto px-4 grid md:grid-cols-3 gap-6">
            <div class="bg-white rounded shadow p-6 text-center">
                <h3 class="text-xl font-semibold text-emerald-600 mb-2">
                    Range Rules
                </h3>
                <p class="text-sm mb-4">
                    Understand and follow our core range guidelines.
                </p>
                <a
                    href="safety.html"
                    class="text-emerald-700 hover:underline text-sm"
                    >Learn More</a
                >
            </div>
            <div class="bg-white rounded shadow p-6 text-center">
                <h3 class="text-xl font-semibold text-emerald-600 mb-2">
                    Youth Programs
                </h3>
                <p class="text-sm mb-4">
                    Explore our education and safety initiatives for youth.
                </p>
                <a
                    href="programs.html"
                    class="text-emerald-700 hover:underline text-sm"
                    >See Programs</a
                >
            </div>
            <div class="bg-white rounded shadow p-6 text-center">
                <h3 class="text-xl font-semibold text-emerald-600 mb-2">
                    Membership Info
                </h3>
                <p class="text-sm mb-4">
                    Join our club and enjoy exclusive member benefits.
                </p>
                <a
                    href="membership.html"
                    class="text-emerald-700 hover:underline text-sm"
                    >Join Today</a
                >
            </div>
        </section>

        <!-- Footer -->
        <div id="footer"></div>
    </body>
</html>
<script src="/isc/scripts/layout.js"></script>
